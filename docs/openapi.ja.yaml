                    nullable: true
                  title:
                    type: string
                    description: リンク先ページのタイトル（取得できる場合）。
                    nullable: true
                  unwound_url:
                    type: string
                    description: リダイレクトをたどった後の最終的なリンク先。
                    nullable: true
                  url:
                    type: string
                    description: t.coの短縮URL。
              nullable: true
          nullable: true
    UserId:
      type: string
      description: ユーザーの一意の識別子
      pattern: ^[0-9]{1,19}$
      example: '2244994945'
    UserPublicMetrics:
      type: object
      description: このユーザーに関する指標のリスト。
      required:
        - followers_count
        - following_count
        - post_count
        - listed_count
      properties:
        followers_count:
          type: integer
          description: このユーザーをフォローしているユーザー数。
          format: int64
        following_count:
          type: integer
          description: このユーザーがフォローしているユーザー数。
          format: int64
        like_count:
          type: integer
          description: このユーザーがいいねしたポスト数。
          format: int64
          nullable: true
        listed_count:
          type: integer
          description: このユーザーを含むリストの数。
          format: int64
        media_count:
          type: integer
          description: このユーザーが投稿したメディアの数。
          format: int64
          nullable: true
        post_count:
          type: integer
          description: このユーザーが作成したポスト数（リポストを含む）。
          format: int64
    UserSubscription:
      type: object
      description: このユーザーとあなたとの間のサブスクリプション関係。
      required:
        - subscribes_to_you
      properties:
        subscribes_to_you:
          type: boolean
          description: このユーザーがあなたをサブスクライブしているかどうか。
    UserWithheld:
      type: object
      description: 表示制限されたコンテンツに関する、制限の詳細。
      properties:
        country_codes:
          type: array
          description: このコンテンツが表示制限されている国のリスト（ISO 3166-1 alpha-2コード）。
          items:
            type: string
          nullable: true
        scope:
          type: string
          description: 表示制限の範囲。ユーザー全体が表示制限されている場合にだけ、値"user"で存在します。
          enum:
            - user
          nullable: true
    XchatSetupRequiredProblem:
