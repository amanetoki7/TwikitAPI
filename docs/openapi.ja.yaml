          schema:
            type: integer
            minimum: 1
            maximum: 100
            format: int32
            default: 100
          style: form
        - name: pagination_token
          in: query
          description: base32hexでエンコードされたページネーショントークン。
          required: false
          schema:
            type: string
            minLength: 1
          style: form
        - $ref: '#/components/parameters/UserFieldsParameter'
        - $ref: '#/components/parameters/UserExpansionsParameter'
        - $ref: '#/components/parameters/PostFieldsParameter'
      responses:
