          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    BearerToken:
      description: '**OAuth 2.0 App-Only**：アプリのベアラートークンを`Authorization`ヘッダーで送信します（`Authorization: Bearer
        <token>`）。リクエストはアプリ自身として行われるため、利用できるのは公開データだけです。'
      type: http
      scheme: bearer
    OAuth2UserToken:
      description: '**OAuth 2.0 認可コードフロー（PKCE）**：アプリを認可したユーザーの代理としてリクエストを行います。アクセストークンに必要なスコープは、各エンドポイントに記載されています。リフレッシュトークンを受け取るには、`offline.access`スコープもあわせて要求します。'
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.x.com/2/oauth2/authorize
          tokenUrl: https://api.x.com/2/oauth2/token
          scopes:
            block.read: あなたがブロックしたアカウントを表示します。
            bookmark.read: あなたがブックマークしたポストを読み取ります。
            bookmark.write: あなたのブックマークを作成、削除します。
            follows.read: あなたがフォローしているアカウントと、あなたをフォローしているアカウントを表示します。
            follows.write: あなたに代わって、アカウントのフォローとフォロー解除を行います。
            like.read: あなたがいいねしたポストと、あなたが閲覧できるいいねを表示します。
            like.write: あなたに代わって、ポストへのいいねとその取り消しを行います。
            mute.read: あなたがミュートしたアカウントを表示します。
            mute.write: あなたに代わって、アカウントのミュートとミュート解除を行います。
            offline.access: アプリ用のリフレッシュトークンを要求します。
            timeline.read: あなたが閲覧できるすべてのカスタムタイムラインを表示します。
            tweet.moderate.write: あなたのポストへの返信を非表示にしたり、再表示したりします。
            tweet.read: あなたが閲覧できるすべてのポストを表示します。非公開アカウントのポストも含みます。
            tweet.write: あなたに代わって、ポストの作成とリポストを行います。
            users.read: あなたが閲覧できるすべてのアカウントを表示します。非公開アカウントも含みます。
    UserToken:
      description: '**OAuth 1.0a ユーザーコンテキスト**：アプリのAPIキーとシークレット、ユーザーのアクセストークンとシークレットでリクエストに署名し、`Authorization`ヘッダーで送信します。'
      type: http
      scheme: OAuth
  schemas:
    Call:
      type: object
      properties:
        conversation_id:
          type: string
          description: この通話が属するXChatの会話（ある場合）。
        created_at:
          type: string
          description: 作成日時（RFC 3339）。
        host_id:
          type: string
          description: 通話のホストのXユーザーID。
        id:
          type: string
          description: 通話の一意の識別子。参加用のシークレットも兼ねます。
        join_policy:
          type: string
          description: 参加できる人の範囲。open（リンクを知っている全員）、closed（ホストが参加を承認）、trusted（ホストの認証済み組織）のいずれか。
        join_url:
          type: string
          description: Xでこの通話に参加するために開くリンク。
        participant_count:
          type: integer
          description: 現在通話に参加している人数。
        title:
          type: string
          description: 通話のタイトル。
        viewer_may_join:
          type: boolean
          description: 認証ユーザーが、ホストに依頼せずに参加できるかどうか。
    ChatPermissionsUnavailableProblem:
      type: object
      required:
        - type
        - title
        - detail
      properties:
        detail:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
          enum:
            - https://api.x.com/2/problems/chat-permissions-unavailable
    CreatePostsClip:
      type: object
      required:
        - post_id
        - start_seconds
        - end_seconds
      properties:
        end_seconds:
          type: integer
          description: クリップが終了する、動画上の秒数。クリップの長さは5〜60秒で、動画全体の30%以下である必要があります。
          minimum: 1
        post_id:
          type: string
          description: クリップ元の動画を含むポストのID。そのポストには、2分を超える動画がちょうど1本含まれている必要があります。
          pattern: ^[0-9]{1,19}$
        start_seconds:
          type: integer
          description: クリップが開始する、動画上の秒数。
          minimum: 0
      additionalProperties: false
    CreatePostsEditOptions:
      type: object
      required:
        - previous_post_id
      properties:
        previous_post_id:
          type: string
          description: 編集対象のポストのID。
          pattern: ^[0-9]{1,19}$
      additionalProperties: false
    CreatePostsGeo:
      type: object
      required:
        - place_id
      properties:
        place_id:
          type: string
          description: ジオタグに使う場所ID。
      additionalProperties: false
    CreatePostsMedia:
      type: object
      required:
        - media_ids
      properties:
        call_to_actions:
          description: メディアエンティティ上に表示される行動喚起（CTA）ボタン。
          $ref: '#/components/schemas/CreatePostsMediaCallToActions'
        description:
          type: string
          description: メディアの説明。動画とAmplifyコンテンツのポストカードに表示されます。
        embeddable:
          type: boolean
          description: trueの場合、メディアのアセットURLは期限切れにならず、外部へのシンジケーション再生が許可されます。
        media_ids:
          type: array
          description: ポストに添付するメディアID。指定した順に添付されます。
          minItems: 1
          maxItems: 20
          items:
            type: string
            pattern: ^[0-9]{1,19}$
        preview_media_id:
          type: string
          description: プレビュー画像として使うアセットのメディアID。
          pattern: ^[0-9]{1,19}$
        tagged_user_ids:
          type: array
          description: メディアにタグ付けするユーザーID。
          maxItems: 10
          items:
            type: string
            pattern: ^[0-9]{1,19}$
        title:
          type: string
          description: メディアのタイトル。動画とAmplifyコンテンツのポストカードに表示されます。
      additionalProperties: false
    CreatePostsMediaCallToActions:
      type: object
      properties:
        app_install:
          description: アプリインストールCTA。ストアIDを少なくとも1つ指定する必要があります。
          $ref: '#/components/schemas/CreatePostsMediaCallToActionsAppInstall'
        visit_site:
          description: サイト訪問CTA。
          $ref: '#/components/schemas/CreatePostsMediaCallToActionsVisitSite'
        watch_now:
          description: 今すぐ視聴CTA。
          $ref: '#/components/schemas/CreatePostsMediaCallToActionsWatchNow'
      additionalProperties: false
    CreatePostsMediaCallToActionsAppInstall:
      type: object
      properties:
        app_store_id:
          type: string
          description: Apple App StoreのiPhoneアプリID。
        ipad_app_store_id:
          type: string
          description: Apple App StoreのiPadアプリID。
        play_store_id:
          type: string
          description: Google PlayストアのアプリID。
      additionalProperties: false
    CreatePostsMediaCallToActionsVisitSite:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: CTAのリンク先となるHTTPS URL。
      additionalProperties: false
    CreatePostsMediaCallToActionsWatchNow:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: CTAのリンク先となるHTTPS URL。
      additionalProperties: false
    CreatePostsPoll:
      type: object
      required:
        - options
        - duration_minutes
      properties:
        duration_minutes:
          type: integer
          description: 投票の期間（分）。
          minimum: 5
          maximum: 10080
        options:
          type: array
          description: 投票の選択肢（2〜4個、各1〜25文字）。
          minItems: 2
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 25
        reply_settings:
          type: string
          description: 投票ポストに返信できるユーザー。互換性のために受け付けますが、バックエンドには渡されず、ミューテーションの発行前に破棄されます（`translate_body`を参照）。
          enum:
            - following
            - mentionedUsers
            - subscribers
            - verified
      additionalProperties: false
    CreatePostsReply:
      type: object
      required:
        - in_reply_to_tweet_id
      properties:
        auto_populate_reply_metadata:
          type: boolean
          description: trueの場合、返信メタデータが自動的に設定されます。互換性のために受け付けますが、バックエンドには渡されず、ミューテーションの発行前に破棄されます（`translate_body`を参照）。
        exclude_reply_user_ids:
          type: array
          description: 返信スレッドから除外するユーザーID。
          items:
            type: string
        in_reply_to_tweet_id:
          type: string
          description: 返信先のポストのID。
          pattern: ^[0-9]{1,19}$
      additionalProperties: false
    CreatePostsRequest:
      type: object
      properties:
        card_uri:
          type: string
          description: カードURIパラメータ。
        clip:
          description: 共有する、別のポストの動画のクリップ。メディア、投票、カード、引用ポスト、ダイレクトメッセージのディープリンクとは併用できません。
          $ref: '#/components/schemas/CreatePostsClip'
        community_id:
          type: string
          description: ポストの投稿先コミュニティ。
          pattern: ^[0-9]{1,19}$
        direct_message_deep_link:
          type: string
          description: ダイレクトメッセージのディープリンク。
        edit_options:
          description: 新しいポストを作成する代わりに、既存のポストを編集します。
          $ref: '#/components/schemas/CreatePostsEditOptions'
        for_super_followers_only:
          type: boolean
          description: ポストをスーパーフォロワー限定にします。
        geo:
          description: ポストの位置情報。
          $ref: '#/components/schemas/CreatePostsGeo'
        made_with_ai:
          type: boolean
          description: ポストにAI生成メディアが含まれることを開示します。
        media:
          description: 添付メディア。
          $ref: '#/components/schemas/CreatePostsMedia'
        nullcast:
          type: boolean
          description: trueの場合、ポストは公開タイムラインに表示されません。
        paid_partnership:
          type: boolean
          description: ポストが有償パートナーシップであることを開示します。
        poll:
          description: 投票の設定。
          $ref: '#/components/schemas/CreatePostsPoll'
        quote_tweet_id:
          type: string
          description: 引用するポストのID。
          pattern: ^[0-9]{1,19}$
        reply:
          description: ポストの返信設定。
          $ref: '#/components/schemas/CreatePostsReply'
        reply_settings:
          type: string
          description: このポストに返信できるユーザー。
          enum:
            - following
            - mentionedUsers
            - subscribers
            - verified
        share_with_followers:
          type: boolean
          description: 限定（スーパーフォロワー向け）ポストを、すべてのフォロワーと共有します。
        text:
          type: string
          description: ポストの本文。メディアを指定しない場合は必須です。アカウントがX Premiumでない限り、最大280文字です。
          default: ''
      additionalProperties: false
    CreatePostsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CreatePostsResponseData'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Problem'
    CreatePostsResponseData:
      type: object
      required:
        - id
        - text
      properties:
        edit_history_post_ids:
          type: array
          description: このポストの編集履歴チェーンに含まれるポストID。
          items:
            type: string
        id:
          type: string
          description: 作成されたポストの一意の識別子。
          pattern: ^[0-9]{1,19}$
        text:
          type: string
          description: 作成されたポストの内容。
    CreateUsersBookmarkRequest:
      anyOf:
        - required:
            - tweet_id
        - required:
            - tweet_ids
      type: object
      description: '`tweet_id`と`tweet_ids`の少なくとも一方が必須です。'
      properties:
        folder_id:
          type: string
          description: ポストを追加するブックマークフォルダーのID（任意）。省略した場合、ポストはユーザーの最上位のブックマークにだけ追加されます。一括リクエストでは、すべてのIDにこの1つのフォルダーが使われます。
          pattern: ^[0-9]{1,19}$
        tweet_id:
          type: string
          description: ユーザーのブックマークに追加するポストのID。`tweet_ids`とは同時に指定できません。
          pattern: ^[0-9]{1,19}$
        tweet_ids:
          type: array
          description: ユーザーのブックマークに追加するポストID。最大25件。`tweet_id`とは同時に指定できません。
          minItems: 1
          maxItems: 25
          items:
            type: string
            pattern: ^[0-9]{1,19}$
    CreateUsersBookmarkResponse:
      oneOf:
        - type: object
          properties:
            data:
              type: object
              required:
                - bookmarked
              properties:
                bookmarked:
                  type: boolean
                  description: ポストがユーザーによってブックマークされているかどうか。
        - type: object
          properties:
            data:
              type: array
              description: ブックマークに成功したポスト（リクエスト順）。
              items:
                type: object
                required:
                  - tweet_id
                  - bookmarked
                properties:
                  bookmarked:
                    type: boolean
                    description: ポストがユーザーによってブックマークされているかどうか。
                  tweet_id:
                    type: string
                    description: ブックマークされたポストのID。
            errors:
              type: array
              description: IDごとの失敗。残りのIDはブックマークされます。
              items:
                type: object
                properties:
                  detail:
                    type: string
                  title:
                    type: string
                  tweet_id:
                    type: string
                    description: 失敗の対象となったポストのID。
    DeletePostsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DeletePostsResponseData'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Problem'
    DeletePostsResponseData:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
          description: ポストが削除されたかどうか。
    DeleteUsersBookmarkResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DeleteUsersBookmarkResponseData'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Problem'
    DeleteUsersBookmarkResponseData:
      type: object
      required:
        - bookmarked
      properties:
        bookmarked:
          type: boolean
          description: ポストがブックマークされているかどうか。
    DisallowedResourceProblem:
      type: object
      required:
        - type
        - title
        - detail
      properties:
        detail:
          type: string
        resource_id:
          type: string
        resource_type:
          type: string
        section:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
          enum:
            - https://api.x.com/2/problems/disallowed-resource
    DmBadAttachmentProblem:
      type: object
      required:
        - type
        - title
        - detail
      properties:
        detail:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
          enum:
            - https://api.x.com/2/problems/dm-bad-attachment
    DmBadCtaProblem:
      type: object
      required:
        - type
        - title
        - detail
      properties:
        detail:
