  /2/tweets/search/stream:
    get:
      tags:
        - Filtered Stream
      summary: フィルターしたポストをストリーミング
      description: 有効なルールセットに一致するポストを、リアルタイムにストリーミングします。
      operationId: streamPosts
      externalDocs:
        url: https://docs.x.com/x-api/posts/filtered-stream/introduction
      x-twitter-streaming: true
      security:
        - BearerToken: []
      parameters:
        - name: backfill_minutes
          in: query
          description: バックフィルを要求する分数。
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5
            format: int32
          style: form
        - name: start_time
          in: query
          description: YYYY-MM-DDTHH:mm:ssZ形式。取得対象とするポストの最も古いUTCタイムスタンプ。
          required: false
          schema:
            type: string
            format: date-time
          style: form
        - name: end_time
          in: query
          description: YYYY-MM-DDTHH:mm:ssZ形式。取得対象とするポストの最も新しいUTCタイムスタンプ。
          required: false
          schema:
            type: string
            format: date-time
          style: form
        - name: tweet.fields
          in: query
          description: 表示するポストのフィールドをカンマ区切りで指定します。
          required: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - article
                - attachments
                - author_id
                - card_uri
                - community_id
                - context_annotations
                - conversation_id
                - created_at
                - display_text_range
                - edit_controls
                - edit_history_tweet_ids
                - entities
                - geo
                - id
                - in_reply_to_user_id
                - lang
                - matched_media_notes
                - media_metadata
                - non_public_metrics
                - note_request_suggestions
                - note_tweet
                - organic_metrics
                - paid_partnership
                - possibly_sensitive
                - promoted_metrics
                - public_metrics
                - referenced_tweets
                - reply_settings
                - scopes
                - source
                - suggested_source_links
                - suggested_source_links_with_counts
                - text
                - withheld
          explode: false
          style: form
        - name: expansions
          in: query
          description: 展開するフィールドをカンマ区切りで指定します。
          required: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - article.cover_media
                - article.media_entities
                - attachments.media_keys
                - attachments.media_source_tweet
                - attachments.poll_ids
                - author_id
                - edit_history_tweet_ids
                - entities.mentions.username
                - geo.place_id
                - in_reply_to_user_id
                - entities.note.mentions.username
                - referenced_tweets.id
                - referenced_tweets.id.attachments.media_keys
                - referenced_tweets.id.author_id
          explode: false
          style: form
        - name: media.fields
          in: query
          description: 表示するメディアのフィールドをカンマ区切りで指定します。
          required: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - alt_text
                - duration_ms
                - height
                - media_key
                - non_public_metrics
                - organic_metrics
                - preview_image_url
                - promoted_metrics
                - public_metrics
                - type
                - url
                - variants
                - width
          explode: false
          style: form
        - name: poll.fields
          in: query
          description: 表示する投票のフィールドをカンマ区切りで指定します。
          required: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - duration_minutes
                - end_datetime
                - id
                - options
                - voting_status
          explode: false
          style: form
        - name: user.fields
          in: query
          description: 表示するユーザーのフィールドをカンマ区切りで指定します。
          required: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - affiliation
                - confirmed_email
                - connection_status
                - created_at
                - description
                - entities
                - id
                - is_identity_verified
                - location
                - most_recent_tweet_id
                - name
                - parody
