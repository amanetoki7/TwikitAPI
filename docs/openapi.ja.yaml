# X API v2 - ポストとユーザー（日本語版）
#
# X API v2 公式 OpenAPI 定義（バージョン 2.174、2026-11-17 に
# https://api.x.com/2/openapi.json から取得）の一部を抜き出し、説明文を日本語に翻訳したもの。
# 41 オペレーション。Redoc 向けに tags と x-tagGroups でグループ分けしている。
# パス、パラメータ名、フィールド名、enum 値などの識別子は公式定義のまま。
#
# ビルド:  npx @redocly/cli build-docs openapi.ja.yaml
openapi: 3.0.0
info:
  title: X API v2
  version: '2.174'
  description: |
    **X API v2**の、ポストとユーザーに関するエンドポイントのリファレンスです。検索、ポスト件数、フィルタードストリーム、タイムライン、ポストの取得、ブックマーク、ポストの管理、リポスト、引用、返信の非表示、ユーザーの取得と検索、フォロー、ミュート、ブロック、いいねを扱います。

    このドキュメントは、X API v2の公式OpenAPI定義（バージョン`2.174`、2026-11-17に`https://api.x.com/2/openapi.json`から取得）の一部を抜き出したもので、41個のオペレーションを収録しています。パス、パラメータ、リクエストボディ、レスポンススキーマの構造は公式定義のままです。オペレーション名と説明文は、公式定義の英語を日本語に翻訳したものです。X公式の翻訳ではないため、原文と食い違う場合は公式定義を正としてください。オペレーションのグループ分け、グループと認証方式の説明、この概要は独自に追加したものです。

    **ベースURL**：すべてのパスは`https://api.x.com`からの相対パスです。

    **認証**：各オペレーションに、利用できる認証方式が記載されています。

    - `BearerToken`：OAuth 2.0 App-Only。アプリとしてリクエストします。利用できるのは公開データだけです。
    - `OAuth2UserToken`：OAuth 2.0 認可コードフロー（PKCE）。ユーザーの代理としてリクエストします。オペレーションに記載されたスコープが必要です。
    - `UserToken`：OAuth 1.0a ユーザーコンテキスト。ユーザーの代理としてリクエストします。

    **フィールドと展開**：既定では、レスポンスには最小限のフィールドしか含まれません。追加のフィールドは`post.fields`、`user.fields`、`media.fields`、`poll.fields`、`place.fields`で指定します。`expansions`を使うと、ポストの作成者や添付メディアなどの関連オブジェクトが`includes`に入って返されます。

    **ページネーション**：一覧を返すレスポンスには`meta`オブジェクトがあります。`meta`に`next_token`が含まれている場合、その値を`pagination_token`（「ユーザーを検索」では`next_token`）に指定すると、次のページを取得できます。

    **エラー**：リクエストが失敗すると、`code`と`message`だけの短いオブジェクト（`application/json`）か、`type`、`title`、`detail`を持つProblemオブジェクト（`application/problem+json`）が返されます。一部だけ成功したレスポンスでは、`data`と並ぶ`errors`配列にProblemオブジェクトが入ります。

    **名称**：パスと一部のリクエストフィールドには以前の名称（`/2/tweets`、`/retweets`、`tweet_id`）が残っていますが、フィールド指定とレスポンスのフィールドは`post`を使います（`post.fields`、`edit_history_post_ids`、`referenced_posts`）。例外は「フィルターしたポストをストリーミング」で、こちらは今も`tweet.fields`を宣言しています。Xの解説ガイドの例も`tweet.fields`のままですが、このドキュメントはOpenAPI定義に従っています。
  termsOfService: https://developer.x.com/en/developer-terms/agreement-and-policy.html
  contact:
    name: X Developers
    url: https://developer.x.com/
  license:
    name: X Developer Agreement and Policy
    url: https://developer.x.com/en/developer-terms/agreement-and-policy.html
externalDocs:
  description: X APIドキュメント
  url: https://docs.x.com/x-api/introduction
servers:
  - description: X API
    url: https://api.x.com
tags:
  - name: Post Search
    x-displayName: 検索
    description: クエリでポストを検索します。最近の検索は直近7日間、全期間検索はアーカイブ全体が対象です。
  - name: Post Counts
    x-displayName: ポスト件数
    description: 検索クエリに一致するポストの件数を、分・時間・日単位で集計して取得します。ポスト本体は取得しません。
  - name: Filtered Stream
    x-displayName: フィルタードストリーム
    description: 持続的なHTTP接続でポストをリアルタイムに受信します。ストリームにはアプリのルールに一致するポストが配信され、残りのオペレーションでそのルールを管理します。
  - name: Timelines
    x-displayName: タイムライン
    description: ユーザー自身のポスト、そのユーザーへのメンション、新しい順のホームタイムラインを取得します。
  - name: Post Lookup
    x-displayName: ポストの取得
    description: IDを指定して、1件または複数件のポストを取得します。
  - name: Bookmarks
    x-displayName: ブックマーク
    description: 認証ユーザーのブックマークを一覧、追加、削除します。
  - name: Manage Posts
    x-displayName: ポストの管理
    description: 認証ユーザーとしてポストを投稿、編集、削除します。
  - name: Reposts
    x-displayName: リポスト
    description: ポストのリポストとその取り消し、あるポストのリポストとリポストしたユーザーの一覧、認証ユーザーのポストに対するリポストの一覧を扱います。
  - name: Quotes
    x-displayName: 引用
    description: 指定したポストを引用しているポストを取得します。
  - name: Hide replies
    x-displayName: 返信の非表示
    description: 認証ユーザーが始めた会話の返信を非表示にしたり、再表示したりします。
  - name: User Lookup
    x-displayName: ユーザーの取得
    description: IDまたはユーザー名でユーザーのプロフィールを取得します。認証ユーザー自身のプロフィールも取得できます。
  - name: User Search
    x-displayName: 検索
    description: クエリでユーザーを検索します。
  - name: Follows
    x-displayName: フォロー
    description: フォロワーとフォロー中のユーザーの一覧を取得し、ユーザーのフォローとフォロー解除を行います。
  - name: Mutes
    x-displayName: ミュート
    description: ユーザーのミュートとミュート解除を行い、認証ユーザーがミュートしているユーザーを一覧します。
  - name: Blocks
    x-displayName: ブロック
    description: 認証ユーザーがブロックしているユーザーを一覧します。
  - name: Likes
    x-displayName: いいね
    description: ポストへのいいねとその取り消し、ポストにいいねしたユーザーの取得を行います。
x-tagGroups:
  - name: ポスト
    tags:
      - Post Search
      - Post Counts
      - Filtered Stream
      - Timelines
      - Post Lookup
      - Bookmarks
      - Manage Posts
  - name: リポスト
    tags:
      - Reposts
  - name: 引用
    tags:
      - Quotes
  - name: 返信の非表示
    tags:
      - Hide replies
  - name: ユーザー
    tags:
      - User Lookup
      - User Search
  - name: フォロー
    tags:
      - Follows
  - name: ミュート
    tags:
      - Mutes
  - name: ブロック
    tags:
      - Blocks
  - name: いいね
    tags:
      - Likes
paths:
  /2/tweets/search/all:
    get:
      tags:
        - Post Search
      summary: 全期間のポストを検索
      description: |-
        検索クエリに一致するポストを、全期間のアーカイブから取得します。

        `start_time`と`since_id`は、どちらか一方だけ指定できます。`end_time`と`until_id`は、どちらか一方だけ指定できます。`pagination_token`と`next_token`は、どちらか一方だけ指定できます。
      operationId: searchPostsAll
      security:
        - OAuth2UserToken:
            - tweet.read
            - users.read
        - UserToken: []
        - BearerToken: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 4096
          style: form
        - name: start_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
          style: form
        - name: end_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
          style: form
        - name: since_id
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]{1,19}$
          style: form
        - name: until_id
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]{1,19}$
          style: form
        - name: max_results
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 500
            format: int32
            default: 10
          style: form
        - name: next_token
          in: query
          description: base32hexでエンコードされたページネーショントークン。
          required: false
          schema:
            type: string
            minLength: 1
          style: form
        - name: pagination_token
          in: query
          description: base32hexでエンコードされたページネーショントークン。
          required: false
          schema:
            type: string
            minLength: 1
          style: form
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum:
              - recency
              - relevancy
          style: form
        - $ref: '#/components/parameters/PostFieldsParameter'
        - $ref: '#/components/parameters/PostExpansionsParameter'
        - $ref: '#/components/parameters/UserFieldsParameter'
        - $ref: '#/components/parameters/MediaFieldsParameter'
        - $ref: '#/components/parameters/PollFieldsParameter'
        - $ref: '#/components/parameters/PlaceFieldsParameter'
      responses:
        '200':
          description: リクエストは成功しました。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPostsAllResponse'
        default:
          description: リクエストは失敗しました。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
