components:
  securitySchemes:
    BearerToken:
      description: '**OAuth 2.0 App-Only.** Send the app''s Bearer Token in the `Authorization` header:
        `Authorization: Bearer <token>`. Requests are made on behalf of the app itself, so only public
        data is available.'
      type: http
      scheme: bearer
    OAuth2UserToken:
      description: '**OAuth 2.0 Authorization Code Flow with PKCE.** Requests are made on behalf of a
        user who has authorized the app. Each endpoint lists the scopes the access token must carry. Request
        the `offline.access` scope as well to receive a refresh token.'
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.x.com/2/oauth2/authorize
          tokenUrl: https://api.x.com/2/oauth2/token
          scopes:
            block.read: View accounts you have blocked.
            bookmark.read: Read your bookmarked Posts.
            bookmark.write: Create and delete your bookmarks.
            follows.read: View accounts you follow and accounts following you.
            follows.write: Follow and unfollow accounts on your behalf.
            like.read: View Posts you have liked and likes you can see.
            like.write: Like and unlike Posts on your behalf.
            mute.read: View accounts you have muted.
            mute.write: Mute and unmute accounts on your behalf.
            offline.access: Request a refresh token for the app.
            timeline.read: View all Custom Timelines you can see.
            tweet.moderate.write: Hide and unhide replies to your posts.
            tweet.read: View all posts you can see, including those from protected accounts.
            tweet.write: Create and repost on your behalf.
            users.read: View any account you can see, including protected accounts.
    UserToken:
      description: '**OAuth 1.0a User Context.** Requests are signed with the app''s API key and secret
        together with the user''s access token and secret, and sent in the `Authorization` header.'
      type: http
      scheme: OAuth
  schemas:
    Call:
      type: object
      properties:
        conversation_id:
          type: string
          description: XChat conversation the call belongs to, if any.
        created_at:
          type: string
          description: Creation time (RFC 3339).
        host_id:
          type: string
          description: X user id of the call's host.
        id:
          type: string
          description: Unique identifier of the call; also its join secret.
        join_policy:
          type: string
          description: 'Who may join: open (anyone with the link), closed (the host admits people), or
            trusted (the host''s Verified Organization).'
        join_url:
          type: string
          description: Link people open to join the call on X.
        participant_count:
          type: integer
          description: People in the call right now.
        title:
          type: string
          description: Title of the call.
        viewer_may_join:
          type: boolean
          description: Whether the authenticated user may join without asking the host.
    ChatPermissionsUnavailableProblem:
      type: object
      required:
        - type
        - title
        - detail
      properties:
        detail:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
          enum:
            - https://api.x.com/2/problems/chat-permissions-unavailable
    CreatePostsClip:
      type: object
      required:
        - post_id
        - start_seconds
        - end_seconds
      properties:
        end_seconds:
          type: integer
          description: Second of the video at which the clip ends. A clip is 5 to 60 seconds long and
            at most 30% of the video.
          minimum: 1
        post_id:
          type: string
          description: The ID of the Post whose video is clipped. The Post must have exactly one video,
            longer than 2 minutes.
          pattern: ^[0-9]{1,19}$
        start_seconds:
          type: integer
          description: Second of the video at which the clip starts.
          minimum: 0
      additionalProperties: false
    CreatePostsEditOptions:
      type: object
      required:
        - previous_post_id
      properties:
        previous_post_id:
          type: string
          description: The ID of the Post being edited.
          pattern: ^[0-9]{1,19}$
      additionalProperties: false
    CreatePostsGeo:
      type: object
      required:
        - place_id
      properties:
        place_id:
          type: string
          description: Place ID for geo tagging.
      additionalProperties: false
    CreatePostsMedia:
      type: object
      required:
        - media_ids
      properties:
        call_to_actions:
          description: Call-to-action button rendered on the media entity.
          $ref: '#/components/schemas/CreatePostsMediaCallToActions'
        description:
          type: string
          description: Description for the media, rendered on the Post card for video and Amplify content.
        embeddable:
          type: boolean
          description: When true, the media's asset URLs do not expire and external syndicated playback
            is allowed.
        media_ids:
          type: array
          description: Media IDs to attach to the Post, in the order given.
          minItems: 1
          maxItems: 20
          items:
            type: string
            pattern: ^[0-9]{1,19}$
        preview_media_id:
          type: string
          description: Media id whose asset is used as the preview image.
          pattern: ^[0-9]{1,19}$
        tagged_user_ids:
          type: array
          description: User IDs tagged in the media.
          maxItems: 10
          items:
            type: string
            pattern: ^[0-9]{1,19}$
        title:
          type: string
          description: Title for the media, rendered on the Post card for video and Amplify content.
      additionalProperties: false
    CreatePostsMediaCallToActions:
      type: object
      properties:
        app_install:
          description: App Install CTA. At least one store id should be provided.
          $ref: '#/components/schemas/CreatePostsMediaCallToActionsAppInstall'
        visit_site:
          description: Visit Site CTA.
          $ref: '#/components/schemas/CreatePostsMediaCallToActionsVisitSite'
        watch_now:
          description: Watch Now CTA.
          $ref: '#/components/schemas/CreatePostsMediaCallToActionsWatchNow'
      additionalProperties: false
    CreatePostsMediaCallToActionsAppInstall:
      type: object
      properties:
        app_store_id:
          type: string
          description: Apple App Store iPhone app id.
        ipad_app_store_id:
          type: string
          description: Apple App Store iPad app id.
        play_store_id:
          type: string
          description: Google Play Store app id.
      additionalProperties: false
    CreatePostsMediaCallToActionsVisitSite:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: HTTPS URL the CTA links to.
      additionalProperties: false
    CreatePostsMediaCallToActionsWatchNow:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: HTTPS URL the CTA links to.
      additionalProperties: false
    CreatePostsPoll:
      type: object
      required:
        - options
        - duration_minutes
      properties:
        duration_minutes:
          type: integer
          description: Duration of the poll in minutes.
          minimum: 5
          maximum: 10080
        options:
          type: array
          description: Poll options (2-4 choices, 1-25 characters each).
          minItems: 2
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 25
        reply_settings:
          type: string
          description: Who can reply to the poll Tweet. Accepted for compatibility; it carries no backend
            argument and is dropped before the mutation is issued (see `translate_body`).
          enum:
            - following
            - mentionedUsers
            - subscribers
            - verified
      additionalProperties: false
    CreatePostsReply:
      type: object
      required:
        - in_reply_to_tweet_id
      properties:
        auto_populate_reply_metadata:
          type: boolean
          description: If true, reply metadata is automatically populated. Accepted for compatibility;
            it carries no backend argument and is dropped before the mutation is issued (see `translate_body`).
        exclude_reply_user_ids:
          type: array
          description: User IDs to exclude from the reply thread.
          items:
            type: string
        in_reply_to_tweet_id:
          type: string
          description: The ID of the tweet being replied to.
          pattern: ^[0-9]{1,19}$
      additionalProperties: false
    CreatePostsRequest:
      type: object
      properties:
        card_uri:
          type: string
          description: Card URI parameter.
        clip:
          description: Clip of another Post's video to share. Cannot be combined with media, a poll, a
            card, a quoted Post or a direct message deep link.
          $ref: '#/components/schemas/CreatePostsClip'
        community_id:
          type: string
          description: Community to post the tweet to.
          pattern: ^[0-9]{1,19}$
        direct_message_deep_link:
          type: string
          description: Direct message deep link.
        edit_options:
          description: Edit an existing tweet rather than creating a new one.
          $ref: '#/components/schemas/CreatePostsEditOptions'
        for_super_followers_only:
          type: boolean
          description: Restrict tweet to super followers.
        geo:
          description: Geo location for the tweet.
          $ref: '#/components/schemas/CreatePostsGeo'
        made_with_ai:
          type: boolean
          description: Disclose that the tweet contains AI-generated media.
        media:
          description: Media attachments.
          $ref: '#/components/schemas/CreatePostsMedia'
        nullcast:
          type: boolean
          description: If true, the tweet is not shown in the public timeline.
        paid_partnership:
          type: boolean
          description: Disclose that the tweet is a paid partnership.
        poll:
          description: Poll configuration.
          $ref: '#/components/schemas/CreatePostsPoll'
        quote_tweet_id:
          type: string
          description: Tweet ID to quote.
          pattern: ^[0-9]{1,19}$
        reply:
          description: Tweet reply configuration.
          $ref: '#/components/schemas/CreatePostsReply'
        reply_settings:
          type: string
          description: Who can reply to this tweet.
          enum:
            - following
            - mentionedUsers
            - subscribers
            - verified
        share_with_followers:
          type: boolean
          description: Share an exclusive (super-follower) tweet with all followers.
        text:
          type: string
          description: Text of the Post. Required unless media is provided. At most 280 characters unless
            the account has X Premium.
          default: ''
      additionalProperties: false
    CreatePostsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CreatePostsResponseData'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Problem'
    CreatePostsResponseData:
      type: object
      required:
        - id
        - text
      properties:
        edit_history_post_ids:
          type: array
          description: Post IDs in this Post's edit history chain.
          items:
            type: string
        id:
          type: string
          description: Unique identifier of the created Post.
          pattern: ^[0-9]{1,19}$
        text:
          type: string
          description: The content of the created Post.
    CreateUsersBookmarkRequest:
      anyOf:
        - required:
            - tweet_id
        - required:
            - tweet_ids
      type: object
      description: At least one of `tweet_id`, `tweet_ids` is required.
      properties:
        folder_id:
          type: string
          description: Optional ID of the Bookmark folder to add the Post(s) to. When omitted, Posts are
            added to the user's top-level Bookmarks only. A bulk request uses this one folder for every
            ID.
          pattern: ^[0-9]{1,19}$
        tweet_id:
          type: string
          description: The ID of the Post to add to the user's Bookmarks. Mutually exclusive with `tweet_ids`.
          pattern: ^[0-9]{1,19}$
        tweet_ids:
          type: array
          description: Post IDs to add to the user's Bookmarks. At most 25. Mutually exclusive with `tweet_id`.
          minItems: 1
          maxItems: 25
          items:
            type: string
            pattern: ^[0-9]{1,19}$
    CreateUsersBookmarkResponse:
      oneOf:
        - type: object
          properties:
            data:
              type: object
              required:
                - bookmarked
              properties:
                bookmarked:
                  type: boolean
                  description: Indicates whether the Post is bookmarked by the user.
        - type: object
          properties:
            data:
              type: array
              description: Successfully bookmarked Posts, in request order.
              items:
                type: object
                required:
                  - tweet_id
                  - bookmarked
                properties:
                  bookmarked:
                    type: boolean
                    description: Indicates whether the Post is bookmarked by the user.
                  tweet_id:
                    type: string
                    description: The Post ID that was bookmarked.
            errors:
              type: array
              description: Per-id failures; remaining IDs are still bookmarked.
              items:
                type: object
                properties:
                  detail:
                    type: string
                  title:
                    type: string
                  tweet_id:
                    type: string
                    description: Post ID the failure applies to.
