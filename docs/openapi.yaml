# X API v2 - Posts and Users
#
# Subset of the official X API v2 OpenAPI definition, version 2.174,
# retrieved 2026-11-17 from https://api.x.com/2/openapi.json.
# 41 operations, regrouped for Redoc with tags and x-tagGroups.
#
# Render:  npx @redocly/cli build-docs openapi.yaml
openapi: 3.0.0
info:
  title: X API v2
  version: '2.174'
  description: |
    Reference for the Post and User endpoints of the **X API v2**: search, Post counts, filtered
    stream, timelines, Post lookup, bookmarks, managing Posts, reposts, quotes, hiding replies, user
    lookup and search, follows, mutes, blocks and likes.

    This document is a subset of the official X API v2 OpenAPI definition (version `2.174`,
    retrieved 2026-11-17 from `https://api.x.com/2/openapi.json`) and covers 41 operations. Paths,
    parameters, request bodies and response schemas are taken from that definition unchanged. The
    grouping of the operations, the descriptions of the groups and security schemes, and this
    introduction were added.

    **Base URL.** All paths are relative to `https://api.x.com`.

    **Authentication.** Every operation lists the methods it accepts.

    | Method | Scheme | Acts as |
    | --- | --- | --- |
    | OAuth 2.0 App-Only | `BearerToken` | The app. Public data only. |
    | OAuth 2.0 Authorization Code with PKCE | `OAuth2UserToken` | A user, within the scopes listed on the operation. |
    | OAuth 1.0a User Context | `UserToken` | A user. |

    **Fields and expansions.** Responses carry only a minimal set of fields by default. Ask for more
    with `post.fields`, `user.fields`, `media.fields`, `poll.fields` and `place.fields`, and use
    `expansions` to have related objects, such as a Post's author or attached media, returned under
    `includes`.

    **Pagination.** List responses have a `meta` object. When it contains `next_token`, pass that
    value as `pagination_token` (as `next_token` on Search Users) to get the next page.

    **Errors.** A failed request returns either a short `code` and `message` object as
    `application/json`, or a problem object as `application/problem+json` with `type`, `title` and
    `detail`. Responses that succeed only in part carry problem objects in an `errors` array next to
    `data`.

    **Naming.** Paths and some request fields keep the earlier vocabulary (`/2/tweets`, `/retweets`,
    `tweet_id`), while field selection and response fields use `post` (`post.fields`,
    `edit_history_post_ids`, `referenced_posts`). Stream Filtered Posts is the exception and still
    declares `tweet.fields`. X's written guides also still show `tweet.fields` in their examples;
    this document follows the OpenAPI definition.
  termsOfService: https://developer.x.com/en/developer-terms/agreement-and-policy.html
  contact:
    name: X Developers
    url: https://developer.x.com/
  license:
    name: X Developer Agreement and Policy
    url: https://developer.x.com/en/developer-terms/agreement-and-policy.html
externalDocs:
  description: X API documentation
  url: https://docs.x.com/x-api/introduction
servers:
  - description: X API
    url: https://api.x.com
tags:
  - name: Post Search
    x-displayName: Search
    description: Search for Posts with a query. Recent search covers the last 7 days; full-archive search
      covers the whole archive.
  - name: Post Counts
    description: Count the Posts that match a search query, bucketed by minute, hour or day, without retrieving
      the Posts themselves.
  - name: Filtered Stream
    description: Receive Posts in real time over a persistent HTTP connection. The stream delivers the
      Posts that match the app's rules; the other operations manage those rules.
  - name: Timelines
    description: Read a user's own Posts, the Posts that mention them, and their reverse-chronological
      home timeline.
  - name: Post Lookup
    description: Retrieve one Post, or several Posts at once, by ID.
  - name: Bookmarks
    description: List, add and remove the authenticated user's bookmarked Posts.
  - name: Manage Posts
    description: Publish, edit and delete Posts on behalf of the authenticated user.
  - name: Reposts
    description: Repost and unrepost Posts, list the reposts of a Post and the users who made them, and
      list the reposts of the authenticated user's Posts.
  - name: Quotes
    description: Retrieve the Posts that quote a given Post.
  - name: Hide replies
    description: Hide or unhide replies in conversations started by the authenticated user.
  - name: User Lookup
    description: Retrieve user profiles by ID or username, or the profile of the authenticated user.
  - name: User Search
    x-displayName: Search
    description: Search for users with a query.
  - name: Follows
    description: Read follower and following lists, and follow or unfollow users.
  - name: Mutes
    description: Mute and unmute users, and list the users the authenticated user has muted.
  - name: Blocks
    description: List the users the authenticated user has blocked.
  - name: Likes
    description: Like and unlike Posts, and look up who liked a Post.
x-tagGroups:
  - name: Posts
    tags:
      - Post Search
      - Post Counts
      - Filtered Stream
      - Timelines
      - Post Lookup
      - Bookmarks
      - Manage Posts
  - name: Reposts
    tags:
      - Reposts
  - name: Quotes
    tags:
      - Quotes
  - name: Hide replies
    tags:
      - Hide replies
  - name: Users
    tags:
      - User Lookup
      - User Search
  - name: Follows
    tags:
      - Follows
  - name: Mutes
    tags:
      - Mutes
  - name: Blocks
    tags:
      - Blocks
  - name: Likes
    tags:
      - Likes
paths:
  /2/tweets/search/all:
    get:
      tags:
        - Post Search
      summary: Search All Posts
      description: |-
        Retrieves Posts from the full archive matching a search query.

        At most one of `start_time`, `since_id` may be provided. At most one of `end_time`, `until_id` may be provided. At most one of `pagination_token`, `next_token` may be provided.
      operationId: searchPostsAll
      security:
        - OAuth2UserToken:
            - tweet.read
            - users.read
        - UserToken: []
        - BearerToken: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 4096
          style: form
        - name: start_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
          style: form
        - name: end_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
          style: form
        - name: since_id
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]{1,19}$
          style: form
        - name: until_id
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]{1,19}$
          style: form
        - name: max_results
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 500
            format: int32
            default: 10
          style: form
        - name: next_token
          in: query
          description: A base32hex-encoded pagination token.
          required: false
          schema:
            type: string
            minLength: 1
          style: form
        - name: pagination_token
          in: query
          description: A base32hex-encoded pagination token.
          required: false
          schema:
            type: string
            minLength: 1
          style: form
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum:
              - recency
              - relevancy
          style: form
        - $ref: '#/components/parameters/PostFieldsParameter'
        - $ref: '#/components/parameters/PostExpansionsParameter'
        - $ref: '#/components/parameters/UserFieldsParameter'
        - $ref: '#/components/parameters/MediaFieldsParameter'
        - $ref: '#/components/parameters/PollFieldsParameter'
        - $ref: '#/components/parameters/PlaceFieldsParameter'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPostsAllResponse'
        default:
          description: The request has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
