  /2/tweets/search/stream:
    get:
      tags:
        - Filtered Stream
      summary: Stream Filtered Posts
      description: Streams Posts in real-time matching the active rule set.
      operationId: streamPosts
      externalDocs:
        url: https://docs.x.com/x-api/posts/filtered-stream/introduction
      x-twitter-streaming: true
      security:
        - BearerToken: []
      parameters:
        - name: backfill_minutes
          in: query
          description: The number of minutes of backfill requested.
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 5
            format: int32
          style: form
        - name: start_time
          in: query
          description: YYYY-MM-DDTHH:mm:ssZ. The earliest UTC timestamp to which the Posts will be provided.
          required: false
          schema:
            type: string
            format: date-time
          style: form
        - name: end_time
          in: query
          description: YYYY-MM-DDTHH:mm:ssZ. The latest UTC timestamp to which the Posts will be provided.
          required: false
          schema:
            type: string
            format: date-time
          style: form
        - name: tweet.fields
          in: query
          description: A comma separated list of Tweet fields to display.
          required: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - article
                - attachments
                - author_id
                - card_uri
                - community_id
                - context_annotations
                - conversation_id
                - created_at
                - display_text_range
                - edit_controls
                - edit_history_tweet_ids
                - entities
                - geo
                - id
                - in_reply_to_user_id
                - lang
                - matched_media_notes
                - media_metadata
                - non_public_metrics
                - note_request_suggestions
                - note_tweet
                - organic_metrics
                - paid_partnership
                - possibly_sensitive
                - promoted_metrics
                - public_metrics
                - referenced_tweets
                - reply_settings
                - scopes
                - source
                - suggested_source_links
                - suggested_source_links_with_counts
                - text
                - withheld
          explode: false
          style: form
        - name: expansions
          in: query
          description: A comma separated list of fields to expand.
          required: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - article.cover_media
                - article.media_entities
                - attachments.media_keys
                - attachments.media_source_tweet
                - attachments.poll_ids
                - author_id
                - edit_history_tweet_ids
                - entities.mentions.username
                - geo.place_id
                - in_reply_to_user_id
                - entities.note.mentions.username
                - referenced_tweets.id
                - referenced_tweets.id.attachments.media_keys
                - referenced_tweets.id.author_id
          explode: false
          style: form
        - name: media.fields
          in: query
          description: A comma separated list of Media fields to display.
          required: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - alt_text
                - duration_ms
                - height
                - media_key
                - non_public_metrics
                - organic_metrics
                - preview_image_url
                - promoted_metrics
                - public_metrics
                - type
                - url
                - variants
                - width
          explode: false
          style: form
        - name: poll.fields
          in: query
          description: A comma separated list of Poll fields to display.
          required: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - duration_minutes
                - end_datetime
                - id
                - options
                - voting_status
          explode: false
          style: form
        - name: user.fields
          in: query
          description: A comma separated list of User fields to display.
          required: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - affiliation
                - confirmed_email
                - connection_status
                - created_at
                - description
                - entities
                - id
                - is_identity_verified
                - location
                - most_recent_tweet_id
                - name
                - parody
                - pinned_tweet_id
                - profile_banner_url
                - profile_image_url
                - protected
                - public_metrics
                - receives_your_dm
                - subscription
                - subscription_type
                - url
                - username
                - verified
                - verified_followers_count
                - verified_type
                - withheld
          explode: false
          style: form
        - name: place.fields
          in: query
          description: A comma separated list of Place fields to display.
          required: false
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum:
                - contained_within
                - country
                - country_code
                - full_name
                - geo
                - id
                - name
                - place_type
          explode: false
          style: form
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamPostsResponse'
        default:
          description: The request has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /2/tweets/search/stream/rules:
    get:
      tags:
        - Filtered Stream
      summary: Get Stream Rules
      description: Returns the active filtered-stream rules for the authenticated app. Provide `ids` to
        fetch specific rules; omit it to list all rules.
      operationId: getRules
      externalDocs:
        url: https://docs.x.com/x-api/posts/rules-lookup
      security:
        - BearerToken: []
      parameters:
        - name: ids
          in: query
          required: false
          schema:
            type: array
            maxItems: 1000
            items:
              type: string
              pattern: ^[0-9]{1,19}$
          explode: false
          style: form
        - name: max_results
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            format: int32
            default: 1000
          style: form
        - name: pagination_token
          in: query
          description: A base32hex-encoded pagination token that decodes to 8 bytes.
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 16
          style: form
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRulesResponse'
        default:
          description: The request has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags:
        - Filtered Stream
      summary: Update Stream Rules
      description: Adds or deletes rules from the active rule set for the filtered stream. Exactly one
        of `add`, `delete`, or `?delete_all=true` must be specified. Use `?dry_run=true` to validate without
        committing.
      operationId: updateRules
      externalDocs:
        url: https://docs.x.com/x-api/posts/filtered-stream/integrate/add-or-delete-rules
      security:
        - BearerToken: []
      parameters:
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
          style: form
        - name: delete_all
          in: query
          required: false
          schema:
            type: boolean
          style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRulesRequest'
        required: true
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRulesResponse'
        default:
          description: The request has failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /2/tweets/search/stream/rules/counts:
    get:
      tags:
        - Filtered Stream
      summary: Get Stream Rule Counts
      description: Retrieves the count of rules in the active rule set for the filtered stream.
      operationId: getRuleCounts
      security:
        - BearerToken: []
      parameters:
        - name: rules_count.fields
          in: query
          required: false
          schema:
            type: string
          style: form
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRuleCountsResponse'
        default:
